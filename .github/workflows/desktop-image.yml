name: Build IceWM desktop image
on:
  push:
    branches: [main, feat/roaming-desktop]
    paths: ["server/desktop/image/**", ".github/workflows/desktop-image.yml"]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build 32-bit IceWM filesystem
        run: |
          docker build --platform linux/386 -t hk-desktop-icewm server/desktop/image
          container_id=$(docker create --platform linux/386 hk-desktop-icewm)
          mkdir rootfs
          docker export "$container_id" | sudo tar -xp -C rootfs
          docker rm "$container_id"
          truncate -s 2000M hk-icewm-v1.ext2
          sudo mke2fs -q -t ext2 -b 4096 -d rootfs hk-icewm-v1.ext2
          sudo e2fsck -fn hk-icewm-v1.ext2
          sha256sum hk-icewm-v1.ext2 > hk-icewm-v1.ext2.sha256
          zstd -T0 -3 hk-icewm-v1.ext2 -o hk-icewm-v1.ext2.zst
      - uses: actions/upload-artifact@v4
        with:
          name: hk-desktop-icewm
          path: |
            hk-icewm-v1.ext2.zst
            hk-icewm-v1.ext2.sha256
          retention-days: 7
